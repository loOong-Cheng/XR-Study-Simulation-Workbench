<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mid-air keypad — synthetic WebXR study</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font: 14px/1.4 system-ui, sans-serif;
        overflow: hidden;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: 380px;
        background: rgba(0, 0, 0, 0.6);
        padding: 10px 14px;
        border-radius: 8px;
      }
      #hud[hidden] {
        display: none;
      }
      #hud h1 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      #hud p {
        margin: 4px 0;
      }
      #felt {
        color: #ffd27a;
      }
      #designs {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      #designs button {
        background: #2c684f;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font: inherit;
      }
      #designs button[aria-pressed="true"] {
        background: #f0c419;
        color: #111;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- Desktop help for people trying the app; hidden in study mode (?study=1), where the task is on the in-scene panel. -->
    <div id="hud" aria-live="polite" hidden>
      <h1>Mid-air keypad</h1>
      <p>Click a key to press it with the fingertip. The panel above the keypad shows what to type.</p>
      <p id="felt"></p>
      <div id="designs" role="group" aria-label="Feedback design"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
