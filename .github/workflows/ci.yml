name: TypeScript and research contracts
# Pull requests, pushes to main, and on demand (Actions → Run workflow). Working branches do not use
# CI minutes on every push; open a pull request to test them.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    # Windows too: path separators, line endings, process spawning and file locks differ there
    # (test-PC findings S1–S5), and researchers run the workbench on Windows lab PCs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The whole job takes a few minutes; a hung test or process must not hold a runner for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      # Chrome for the WebXR runtime test (test/webxr-runtime.test.ts skips without it).
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-dependencies: true
      - run: npm ci --ignore-scripts
      - run: npm run check
      # npm test runs every test/*.test.ts (a test fails if one is missing from the script) with a time
      # limit per test; tests end the servers they start, also after a failed assertion. Not
      # --test-force-exit: it ends a file's run before its later tests. The step limit is the backstop.
      - run: npm test
        timeout-minutes: 10
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run demo
